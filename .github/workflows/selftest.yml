# The self-test, executed by the harness rather than by whoever remembers to run it.
#
# That is this project's own argument for its hooks, applied to itself: a rule fires by topic, not
# by rule, and "run the suite before you push" is a rule. It was obeyed while the task was about the
# suite and would not have been obeyed while the task was about something else.
#
# Three claims are under test here that no local run can make:
#
#   * The Python floor. pyproject.toml enforces it and INSTALL.md states it; the matrix below starts
#     AT the floor and ends at the newest CPython, and the suite reads all three back (suite_docs),
#     so they cannot drift apart. A stated minimum version is a number in prose: 3.9 stayed promised
#     after GitHub's ubuntu-latest stopped offering a 3.9 to test it on, and this workflow went red
#     with no code change (K003, 2026-11-23).
#   * "no network, no credentials, no configuration" - the suite says so in its own output. Here it
#     runs on a machine that has none of the author's setup, and on a runner with no PDF or .docx
#     library installed, which is the state a locked-down work laptop is actually in.
#   * `pip install "krokai[all]"` - the command INSTALL.md recommends - installs THIS release on
#     every supported Python (job `installed-all`).
#
# publish.yml runs this whole file (`workflow_call`) before it uploads anything, so a release can no
# longer leave from a red pipeline.
#
# Nothing here needs a secret. If this workflow ever needs one, something has gone wrong upstream.
name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          # Developed on Windows, and the hooks force UTF-8 on stderr because without it the
          # warning arrives as mojibake exactly where it matters. Worth one runner - on the newest
          # Python, because that is what a fresh python.org install on a new laptop is.
          - os: windows-latest
            python: '3.15'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: every module compiles
        run: python -m compileall -q krokai hooks

      - name: self-test, with no optional library installed
        run: python -m krokai selftest

      - name: outbound gate
        run: python -m krokai gate --self-test

      - name: doctor reports the missing libraries rather than pretending
        # No casefile here, so INCOMPLETE and exit 1 are the correct answers. What is being checked
        # is that the status line and the exit code agree - a sibling project shipped a doctor that
        # printed READY and exited 1, which is worse than having no status line at all.
        #
        # 🔴 The first version of this step died on its own first run, and the tool was fine. GitHub
        # runs `bash -e`, so `cmd; rc=$?` ABORTS THE STEP the moment cmd is non-zero - before the
        # line that would have reported it. A check that captures an exit code cannot fail
        # informatively under `-e`; it can only vanish. `cmd || rc=$?` puts the command on the left
        # of an operator, which is the one place `-e` leaves alone.
        shell: bash
        run: |
          rc=0; out="$(python -m krokai doctor)" || rc=$?
          echo "$out"; echo "exit=$rc"
          case "$out" in
            *"STATUS: READY"*)      [ "$rc" = 0 ] || { echo "READY but exit $rc";      exit 1; } ;;
            *"STATUS: INCOMPLETE"*) [ "$rc" = 1 ] || { echo "INCOMPLETE but exit $rc"; exit 1; } ;;
            *) echo "doctor printed no status line at all"; exit 1 ;;
          esac

      - name: the hooks survive junk on stdin and still exit 0
        # A Stop hook that returns non-zero prevents the turn from ending and can loop.
        shell: bash
        run: |
          bad=0
          for h in hooks/quote_guard.py hooks/bank_queue.py hooks/session_anchor.py; do
            rc=0; echo 'not json at all' | python "$h" >/dev/null 2>&1 || rc=$?
            echo "$h exit=$rc"; [ "$rc" = 0 ] || bad=1
          done
          exit $bad

  # 🔴 THE SUITE ABOVE RUNS FROM THE CHECKOUT, AND THAT IS THE ONE LAYOUT WHERE THE BUG COULD NOT
  # APPEAR. This package's data lives at the repository root; the code reached it by walking one
  # level up out of the package, which resolves in a clone and points at `site-packages` once
  # installed. The clone suite passed 421/421 for the whole life of the defect. This job builds
  # the wheel, installs it somewhere else, and runs it from an unrelated directory.
  installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m venv /tmp/probe
          /tmp/probe/bin/python -m pip install --quiet dist/*.whl
      - name: Run the suite from the INSTALLED copy, from an unrelated directory
        working-directory: /tmp
        run: /tmp/probe/bin/krokai selftest
      - name: The shipped data must be reachable from the installed package
        working-directory: /tmp
        run: |
          /tmp/probe/bin/python -c "
          from krokai.citations import available_packs
          from krokai.consult import load_registry, REGISTRY_NAME
          packs = available_packs()
          assert 'us-federal' in packs, 'citation packs unreachable when installed: %s' % packs
          load_registry()
          print('installed copy sees packs=%s and finds %s' % (packs, REGISTRY_NAME))
          "

  # 🔴 THE COMMAND INSTALL.md RECOMMENDS WAS NEVER RUN BY CI, AND FOR THREE MONTHS IT INSTALLED THE
  # WRONG RELEASE. 0.9.0 put onnxruntime (wheels only, no sdist) into `[all]`; on a Python it had
  # no wheel for, pip did not fail - it walked back through older krokai releases until one's
  # `[all]` resolved and printed "Successfully installed krokai-0.8.6" (measured on 3.15, K001).
  # The job that installed "the optional libraries" named three of them by hand, so it could not
  # see it. This one installs the BUILT wheel with `[all]` exactly as a user would: a local wheel
  # file cannot be backtracked, so an extra that stops resolving turns this job red instead of
  # turning a user's install seven releases old. It also replaces that hand-named job: the same
  # suite, with the PDF and .docx engines present, from the installed copy.
  installed-all:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.14', '3.15']
        include:
          - os: windows-latest
            python: '3.15'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --quiet --upgrade build
          python -m build --wheel
      - name: Install the BUILT wheel with [all] into a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/probe"
          py="$RUNNER_TEMP/probe/bin/python"; [ -x "$py" ] || py="$RUNNER_TEMP/probe/Scripts/python.exe"
          echo "PROBE_PY=$py" >> "$GITHUB_ENV"
          whl="$(ls dist/*.whl)"
          "$py" -m pip install --quiet "${whl}[all]"
          "$py" -m pip check
          want="$(basename "$whl" | cut -d- -f2)"
          got="$("$py" -c 'import krokai; print(krokai.__version__)')"
          echo "built $want, installed $got"
          [ "$want" = "$got" ] || { echo "the installed krokai is not the one just built"; exit 1; }
          "$py" -m pip list | grep -i -E '^(krokai|pymupdf|pypdf|mammoth|requests|onnxruntime) ' || true
      - name: The suite and doctor from the installed copy, in an unrelated folder
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          rc=0; "$PROBE_PY" -m krokai selftest 2> selftest.err || rc=$?
          cat selftest.err
          [ "$rc" = 0 ] || { echo "selftest exit $rc"; exit 1; }
          # PyMuPDF 2.x warns that `fitz` "will be removed"; once it is, a leftover `import fitz`
          # reads as "PyMuPDF not installed" and the second PDF engine drops out silently.
          if grep -F 'The `fitz` API is deprecated' selftest.err; then
            echo "a code path still imports PyMuPDF under its deprecated name"; exit 1
          fi
          out="$("$PROBE_PY" -m krokai doctor || true)"; echo "$out"
          echo "$out" | grep -q -E '^ +pypdf +installed' || { echo "[all] left pypdf out"; exit 1; }
          echo "$out" | grep -q -E '^ +PyMuPDF +installed' || { echo "[all] left PyMuPDF out"; exit 1; }

  # The check that would have caught 2026-08-04: a workflow with a YAML syntax error is still
  # listed 'active', still accepts its cron, notifies nobody, and never runs. Pinned to a release:
  # `:latest` is a reference that moves under a green pipeline, which is how ubuntu-latest broke it.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
