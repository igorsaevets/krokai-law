# Packaging for PyPI.
#
# 🔴 WHY hatchling AND NOT setuptools. This project keeps its shipped data in three top-level
# directories - `packs/`, `templates/`, `hooks/` - deliberately, because "copy the folder and run
# `python krokai/`" is a documented and supported install path for people whose employer will not
# let them run `pip install`. setuptools cannot pull a directory that lives OUTSIDE the package
# into the wheel; hatchling can, with `force-include`. So the repository layout stays exactly as
# it is, the clone-and-run path is untouched, and the wheel still carries its data.
#
# The matching half of this fix is `krokai/_datadir.py`: the code used to find that data by
# walking one level up out of the package, which is right for a clone and resolves to
# `site-packages/packs` once installed. Read the header of that file before changing either side.
#
# DEPENDENCIES ARE OPTIONAL ON PURPOSE. Every third-party import in this package sits inside a
# `try/except ImportError` with a working degraded path, because the audience includes locked-down
# machines. Declaring them as hard requirements would make `pip install krokai` fail on exactly
# the machines the design is aimed at. They are extras instead:
#
#   pip install krokai            -> the tool, .txt/.md/.html corpora, no network
#   pip install krokai[pdf]       -> + PDF reading
#   pip install krokai[docx]      -> + .docx reading
#   pip install krokai[fetch]     -> + fetching a source over the network
#   pip install krokai[all]       -> everything

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "krokai"
dynamic = ["version"]
description = "Check every quotation in a document against the actual source text on your own disk. A grounded citation does not prove the quote is real."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Igor Saevets" }]
keywords = ["citations", "hallucination", "legal", "verification", "quotes", "llm", "fact-checking"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]

# Empty on purpose. See the note at the top of this file.
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4", "pymupdf>=1.24"]
docx = ["mammoth>=1.6"]
fetch = ["requests>=2.28"]
ocr = ["pymupdf>=1.24", "rapidocr", "onnxruntime", "numpy"]
all = ["pypdf>=4", "pymupdf>=1.24", "mammoth>=1.6", "requests>=2.28", "rapidocr", "onnxruntime", "numpy"]

[project.scripts]
krokai = "krokai.cli:main"

[project.urls]
Homepage = "https://github.com/igorsaevets/krokai-law"
Source = "https://github.com/igorsaevets/krokai-law"
Issues = "https://github.com/igorsaevets/krokai-law/issues"
Changelog = "https://github.com/igorsaevets/krokai-law/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "krokai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["krokai"]

# The whole point of choosing hatchling. Each of these lives at the repo root and must arrive
# INSIDE the installed package, because `_datadir.py` looks there first.
[tool.hatch.build.targets.wheel.force-include]
"packs" = "krokai/packs"
"templates" = "krokai/templates"
"hooks" = "krokai/hooks"
"channels.json" = "krokai/channels.json"

[tool.hatch.build.targets.sdist]
include = ["krokai", "packs", "templates", "hooks", "channels.json", "README.md", "LICENSE", "CHANGELOG.md"]
