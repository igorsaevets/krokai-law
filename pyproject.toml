# Packaging for PyPI.
#
# 🔴 WHY hatchling AND NOT setuptools. This project keeps its shipped data in three top-level
# directories - `packs/`, `templates/`, `hooks/` - deliberately, because "copy the folder and run
# `python krokai/`" is a documented and supported install path for people whose employer will not
# let them run `pip install`. setuptools cannot pull a directory that lives OUTSIDE the package
# into the wheel; hatchling can, with `force-include`. So the repository layout stays exactly as
# it is, the clone-and-run path is untouched, and the wheel still carries its data.
#
# The matching half of this fix is `krokai/_datadir.py`: the code used to find that data by
# walking one level up out of the package, which is right for a clone and resolves to
# `site-packages/packs` once installed. Read the header of that file before changing either side.
#
# DEPENDENCIES ARE OPTIONAL ON PURPOSE. Every third-party import in this package sits inside a
# `try/except ImportError` with a working degraded path, because the audience includes locked-down
# machines. Declaring them as hard requirements would make `pip install krokai` fail on exactly
# the machines the design is aimed at. They are extras instead:
#
#   pip install krokai            -> the tool, .txt/.md/.html corpora, no network
#   pip install krokai[pdf]       -> + PDF reading
#   pip install krokai[docx]      -> + .docx reading
#   pip install krokai[fetch]     -> + fetching a source over the network
#   pip install krokai[all]       -> all three
#
# 🔴 NO EXTRA MAY NAME A PACKAGE THAT SHIPS WHEELS ONLY (K003, measured 2026-11-23). When one
# requirement of an extra has no wheel and no sdist for the user's Python or platform, pip does not
# fail: it walks back through OLDER krokai releases until it finds one whose extra resolves, and
# prints "Successfully installed". 0.9.0 put onnxruntime (wheels only, cp311-cp314, five platforms)
# into `all` and `ocr`; from then on `pip install "krokai[all]"` on Python 3.15 - and on 3.14 on any
# Mac with an Intel chip - replaced the current release with 0.8.6, seven releases old, exit 0. An
# environment marker cannot fix it: musl, an old glibc, macOS 13 and free-threaded builds have no
# marker. So OCR is its own pip command, `pip install rapidocr onnxruntime`, which names no krokai:
# where onnxruntime has no wheel it fails loudly and leaves krokai alone. `krokai doctor` says so.
# Every extra here is pure Python or ships an sdist; CI installs the BUILT wheel with `[all]` on
# every supported Python - a local wheel file cannot be backtracked, so a regression goes red.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "krokai"
dynamic = ["version"]
description = "AI citation and quote checker for legal documents: checks every quotation in a draft against the actual source text on your own disk. A grounded citation does not prove the quote is real."
readme = "README.md"
# 3.11 (K003, 2026-11-23): 3.9 and 3.10 are end-of-life; GitHub's ubuntu-latest has no 3.9 to test
# on; PyMuPDF 2.x and today's onnxruntime start at 3.11; pip on 3.9 cannot use the Windows
# certificate store, so behind a TLS-inspecting antivirus it cannot install anything. An older
# Python is not stranded: pip skips this release for it and installs the last one that supports it.
# NEVER add an upper bound here - pip would answer it by installing an older krokai without one.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Igor Saevets" }]
keywords = ["citations", "hallucination", "legal", "verification", "quotes", "llm", "fact-checking",
            "citation-checker", "immigration", "uscis", "legal-tech", "citation-verification",
            "case-law", "ai-hallucination", "eb2-niw", "eb1a"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]

# Empty on purpose. See the note at the top of this file.
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4", "pymupdf>=1.24"]
docx = ["mammoth>=1.6"]
fetch = ["requests>=2.28"]
all = ["pypdf>=4", "pymupdf>=1.24", "mammoth>=1.6", "requests>=2.28"]

[project.scripts]
krokai = "krokai.cli:main"

[project.urls]
Homepage = "https://github.com/igorsaevets/krokai-law"
Source = "https://github.com/igorsaevets/krokai-law"
Issues = "https://github.com/igorsaevets/krokai-law/issues"
Changelog = "https://github.com/igorsaevets/krokai-law/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "krokai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["krokai"]

# The whole point of choosing hatchling. Each of these lives at the repo root and must arrive
# INSIDE the installed package, because `_datadir.py` looks there first.
[tool.hatch.build.targets.wheel.force-include]
"packs" = "krokai/packs"
"templates" = "krokai/templates"
"hooks" = "krokai/hooks"
"channels.json" = "krokai/channels.json"
# `krokai agents` prints this for the pip user, who never sees the repository root.
"AGENTS.md" = "krokai/AGENTS.md"

[tool.hatch.build.targets.sdist]
include = ["krokai", "packs", "templates", "hooks", "channels.json", "AGENTS.md", "CLAUDE.md", "README.md", "LICENSE", "CHANGELOG.md"]
